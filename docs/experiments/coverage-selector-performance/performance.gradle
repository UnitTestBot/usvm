gradle.projectsEvaluated {
    def jvm = gradle.rootProject.findProject(':usvm-jvm')
    if (jvm == null) return
    jvm.tasks.register('coverageSelectorPerformance', Test) {
        testClassesDirs = jvm.sourceSets.test.output.classesDirs
        classpath = jvm.sourceSets.test.runtimeClasspath
        dependsOn(jvm.tasks.named('testClasses'))
        useJUnitPlatform { includeTags 'manual' }
        filter { includeTestsMatching 'org.usvm.experiments.CoverageSelectorPerformanceTest' }
        enableAssertions = false
        maxHeapSize = '4g'
        def logging = jvm.rootProject.file('docs/experiments/coverage-selector-performance/logback.xml')
        jvmArgs "-Dlogback.configurationFile=${logging.absolutePath}"
        ['case', 'mode', 'steps', 'timeoutMillis', 'results', 'jars', 'repetition', 'seed'].each { key ->
            systemProperty("coverage.perf.${key}", jvm.findProperty("coveragePerf${key.capitalize()}"))
        }
        outputs.upToDateWhen { false }
    }
}
